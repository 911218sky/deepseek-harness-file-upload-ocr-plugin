- insert:
    - id: file-upload-ocr
      name: dsh-file-upload-ocr-plugin
      config:
        pythonCommand: !!js process.env.DSH_FILE_OCR_PYTHON ?? 'auto'
        maxFileBytes: 104857600
        maxPages: 200
        dpi: 144
        nativeTextMinChars: 24
        timeoutMs: 900000
        maxOutputChars: 1000000
